<script>
/*
  V12.2 player-list fix.

  Empty slots can be filled from the CURRENT #names list, not from the
  original tournament snapshot. This means changing the player list after
  generating a bracket immediately changes the choices in the dropdown.

  Existing players are never duplicated: a player is only offered if their
  pN id is not currently present in any bracket/final match.
*/

function currentPlayerList(){
  return [...document.querySelectorAll('#names input')]
    .map((input,i)=>({
      id:'p'+i,
      name:(input.value||input.placeholder||`Player ${i+1}`).trim() || `Player ${i+1}`
    }));
}

function tournamentPlayerById(id){
  if(!tournament || !id) return null;
  const seen=new Set();

  function scanPlayer(p){
    if(!p || !p.id || seen.has(p.id)) return null;
    seen.add(p.id);
    return p.id===id ? p : null;
  }

  for(const round of (tournament.wb||[])){
    for(const m of (round||[])){
      for(const p of (m.players||[])){
        const found=scanPlayer(p); if(found)return found;
      }
      const found=scanPlayer(m.winner); if(found)return found;
    }
  }
  for(const round of (tournament.lb||[])){
    for(const m of (round||[])){
      for(const p of (m.players||[])){
        const found=scanPlayer(p); if(found)return found;
      }
      const found=scanPlayer(m.winner); if(found)return found;
    }
  }

  for(const list of [
    tournament.scPool,
    tournament.scWildcards,
    tournament.scFinalists,
    tournament.unassigned,
    tournament.final?.players
  ]){
    for(const p of (list||[])){
      const found=scanPlayer(p); if(found)return found;
    }
  }

  return null;
}

function idsUsedInTournament(excludeType,excludeRound,excludeMatch){
  const used=new Set();

  const addMatch=(m)=>{
    if(!m)return;
    (m.players||[]).forEach(p=>{if(p&&p.id)used.add(p.id)});
  };

  (tournament?.wb||[]).forEach((round,r)=>{
    (round||[]).forEach((m,mi)=>{
      if(excludeType==='wb' && r===excludeRound && mi===excludeMatch)return;
      addMatch(m);
    });
  });

  (tournament?.lb||[]).forEach((round,r)=>{
    (round||[]).forEach((m,mi)=>{
      if(excludeType==='lb' && r===excludeRound && mi===excludeMatch)return;
      addMatch(m);
    });
  });

  (tournament?.final?.players||[]).forEach(p=>{
    if(p&&p.id)used.add(p.id);
  });

  return used;
}

function currentListCandidates(type,r,mi){
  /*
    The current player/deck list is authoritative. Show ALL current entries,
    including decks that already exist elsewhere in the bracket.
  */
  return currentPlayerList();
}

function addCurrentListPlayer(type,r,mi){
  const arr=type==='wb'?tournament.wb[r]:tournament.lb[r];
  const match=arr&&arr[mi];

  if(!match || match.winner || match.players.length>=4)return;

  const candidates=currentListCandidates(type,r,mi);
  if(!candidates.length){
    alert('There are no unused players in the current player list available for this slot.');
    return;
  }

  const select=document.getElementById(`playerSelect_${type}_${r}_${mi}`);
  if(!select || !select.value)return;

  const selected=currentPlayerList().find(p=>p.id===select.value);
  if(!selected)return;

  /* Reuse the existing tournament player object when possible.
     No cross-match duplicate safety check: the current player/deck list is
     authoritative and may be used to update any bracket slot. */
  let player=tournamentPlayerById(selected.id);

  if(player){
    /*
      This is deliberately the same player/deck identity, but its current
      list name is authoritative. This lets an updated deck name be used.
    */
    player.name=selected.name;
  }else{
    player={id:selected.id,name:selected.name,losses:0};
  }

  match.players.push(player);

  /* Remove this id from the unassigned pool if it was there. */
  tournament.unassigned=(tournament.unassigned||[])
    .filter(p=>!p || p.id!==player.id);

  render();
}

function renderMatch(m,type,r,mi){
  let s=`<div class="match"><div class="match-title">${type==='wb'?'Match':'Loss Match'} ${mi+1}</div>`;
  const players=m.players||[];

  for(let i=0;i<players.length;i++){
    const p=players[i];
    if(!p)continue;

    let cls=m.winner===p?'winner':(m.winner&&m.winner!==p?'loser':'');
    let actions='';

    if(!m.winner){
      if(players.length===1){
        actions+=`<button onclick="advanceSoloPlayer('${type}',${r},${mi})">Advance</button>`;
      }else if(
        players.length===4 ||
        (type==='lb' && players.length>=2) ||
        (type==='wb' && r===0 && players.length>=2)
      ){
        actions+=`<button onclick="chooseWinner('${type}',${r},${mi},${i})">Winner</button>`;
      }
    }

    actions+=`<button class="remove-player" title="Remove player" aria-label="Remove player" onclick="removePlayerFromMatch('${type}',${r},${mi},${i})">×</button>`;

    s+=`<div class="player ${cls}">
      <span>${esc(p.name)}</span>
      <span class="player-actions">${actions}</span>
    </div>`;
  }

  if(!m.winner && players.length<4){
    const candidates=currentListCandidates(type,r,mi);

    s+=`<div class="add-player-panel">`;

    if(candidates.length){
      s+=`<select id="playerSelect_${type}_${r}_${mi}" aria-label="Select player to add">
        <option value="">Select any player/deck from current list...</option>`;

      candidates.forEach(p=>{
        s+=`<option value="${esc(p.id)}">${esc(p.name)}</option>`;
      });

      s+=`</select>
        <button type="button" onclick="addCurrentListPlayer('${type}',${r},${mi})">Add</button>`;
    }else{
      s+=`<span class="no-players">No players available in the current player list.</span>`;
    }

    s+=`</div>`;
  }

  if(m.winner){
    s+=`<div class="note">Winner: ${esc(m.winner.name)}</div>`;

    if(type==='lb' && r===1 && !(tournament.lbMovedToWinners||{})[m.winner.id]){
      s+=`<div class="note">Losers Round 2 finalist.</div>`;
    }else if(type==='lb' && r===1 && (tournament.lbMovedToWinners||{})[m.winner.id]){
      s+=`<div class="note">Winner moved to Winners Bracket.</div>`;
    }
  }else if(players.length<4 && type!=='lb'){
    s+=`<div class="note">This match needs ${4-players.length} more player${4-players.length===1?'':'s'}.</div>`;
  }

  s+='</div>';
  return s;
}</script>
